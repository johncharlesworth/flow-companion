name: Idea or feature request
description: Suggest something Flow Companion could do.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What you'd like Flow Companion to do, and where in the panel you'd look for it.
